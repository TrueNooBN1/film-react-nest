events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Включаем SSL конфигурацию
    include /etc/nginx/ssl.conf;

    # Основной сервер (HTTP → HTTPS редирект)
    server {
        listen 80;
        server_name film-truenoob.nomorepartiessbs.ru www.film-truenoob.nomorepartiessbs.ru;
        server_tokens off;

        # Для certbot challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект всего на HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl http2;
        server_name film-truenoob.nomorepartiessbs.ru www.film-truenoob.nomorepartiessbs.ru;
        server_tokens off;

        # Подключаем SSL конфиг
        include /etc/nginx/ssl.conf;

        # Пути к SSL сертификатам
        ssl_certificate /etc/letsencrypt/live/film-truenoob.nomorepartiessbs.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/film-truenoob.nomorepartiessbs.ru/privkey.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Корень для статики
        root /usr/share/nginx/html;
        index index.html index.htm;

        # SPA роутинг
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API прокси к бэкенду
        location /api/ {
            proxy_pass http://backend:3000/api/afisha/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

         location /content/afisha/ {
            proxy_pass http://backend:3000/content/afisha/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
       # # Health check
        # location /health {
        #     access_log off;
        #     return 200 "healthy\n";
        #     add_header Content-Type text/plain;
        # }

        # # Запретить доступ к скрытым файлам
        # location ~ /\. {
        #     deny all;
        #     access_log off;
        #     log_not_found off;
        # }
        # # Блокировать доступ к sensitive файлам
        # location ~* (\.env|\.git|\.htaccess|\.htpasswd|README\.md|composer\.json|composer\.lock|package\.json|package-lock\.json)$ {
        #     deny all;
        #     access_log off;
        #     log_not_found off;
        # }
    }
}