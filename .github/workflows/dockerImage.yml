env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

name: publish
on: 
  push:
    branches: [review-3, main]
jobs:
  build-and-publish-latest:
    runs-on: ubuntu-latest
    # if: github.ref == 'refs/heads/master'

    steps:

        - name: Get repository name
          id: vars
          run: |
            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
            echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_OUTPUT
            ACTOR=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
            echo "ACTOR=${ACTOR}" >> $GITHUB_OUTPUT
            echo "Using repository name: ${REPO_NAME}"
          # Берем только имя репозитория (после /)
        - uses: actions/checkout@v4 # Checking out the repo
        - name: Log in to the Container registry
          uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push Docker frontend image 
          uses: docker/build-push-action@v4
          with:
            context: ./frontend
            push: true
            tags: |
              ghcr.io/${{ steps.vars.outputs.ACTOR }}/${{ steps.vars.outputs.REPO_NAME }}-frontend:latest
          # labels: ${{ steps.meta.outputs.labels }} 

        - name: Build and push Docker backend image 
          uses: docker/build-push-action@v4
          with:
            context: ./backend
            push: true
            tags: |
              ghcr.io/${{ steps.vars.outputs.ACTOR }}/${{ steps.vars.outputs.REPO_NAME }}-backend:latest
          # labels: ${{ steps.meta.outputs.labels }} 